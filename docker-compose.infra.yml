# Local infrastructure ONLY (ADR-0009): services run bare via `dotnet run`.
# Usage:
#   docker compose -f docker-compose.infra.yml up -d                     # core: Postgres + RabbitMQ + Valkey
#   docker compose -f docker-compose.infra.yml --profile portals up -d   # + Kafka, Kafka UI, pgAdmin (dev-up.sh default)
# The `portals` profile keeps the dev portals out of the fast CI lane: PRs and develop run e2e-verify on the
# plain core (on the old 2-vCPU private runners the extra JVMs flaked unrelated browser tests); pushes to the
# release stages test/main run the full set (scripts/lib/infra.sh INFRA_SET=full, ci.yml browser-e2e, ADR-0058).
name: 3commerce-infra

services:
  postgres:
    image: postgres:18
    container_name: 3commerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      # Postgres 18's image moved its default data dir AND its declared VOLUME (from /var/lib/postgresql/data
      # to /var/lib/postgresql). The named volume is therefore mounted at /var/lib/postgresql — the declared
      # path — and PGDATA pinned to a subdir of it. Mounting one level lower (the pre-18 convention) made
      # Docker add an ANONYMOUS volume for the declared path on every container create; each plain down→up
      # orphaned one. The data still sits at <volume>/pgdata, so existing volumes need no migration.
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: 3commerce-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (guest/guest)
    volumes:
      # The image declares VOLUME /var/lib/rabbitmq, so WITHOUT this Docker mints a fresh anonymous
      # volume on every container recreate and orphans the previous one — a slow disk leak that
      # `docker volume ls` shows only as unreadable hashes. Naming it also keeps queue state across
      # a normal `down`/`up`, matching how pgdata and kafka_data are treated here.
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Valkey (BSD-licensed Redis drop-in) — shared cache / fast-path lane (ADR-0044): distributed rate
  # limiting, idempotency/webhook dedupe, and session introspection cache. Single node for local/CI;
  # prod runs Valkey HA (Sentinel/Cluster) via Helm. Persistence on (appendonly) so a restart doesn't
  # drop everything, though every key is TTL'd and reconstructable from Postgres. Password matches the
  # dev connection string used by the services (ConnectionStrings:Redis).
  valkey:
    image: valkey/valkey:8-alpine
    container_name: 3commerce-valkey
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "valkey_dev", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a valkey_dev ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prometheus exporter for Valkey server metrics (memory, evictions, keyspace, replication) — feeds the
  # Grafana redis-overview dashboard. Ops portal, so kept out of CI under the `portals` profile.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: 3commerce-redis-exporter
    profiles: ["portals"]
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://valkey:6379"
      REDIS_PASSWORD: "valkey_dev"
    ports:
      - "9121:9121"

  # Kafka broker (KRaft, single node) — mirrors the Helm kafka config (ADR-0034 durable-stream lane).
  # In-cluster clients use kafka:9092; host clients use localhost:29092 (the EXTERNAL advertised listener).
  kafka:
    # bitnamilegacy = Bitnami's frozen mirror; the public bitnami/kafka:3.9 tag was pulled from Docker
    # Hub in the 2025 "Bitnami Secure Images" migration. Keeps the KAFKA_CFG_* env convention.
    image: bitnamilegacy/kafka:3.9
    container_name: 3commerce-kafka
    profiles: ["portals"]
    ports:
      - "29092:29092"  # host-facing PLAINTEXT (advertised as localhost:29092)
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Kafka UI (http://localhost:8090) — always on in local dev (dev-up.sh), pre-pointed at the broker above.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: 3commerce-kafka-ui
    profiles: ["portals"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"    # host 8090 (8080 is the gateway); container serves on 8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Web DB admin portal (http://localhost:5050), pre-connected to the Postgres instance so all 14
  # service DBs appear under one server. Local-dev only — never deploy this (creds are the dev creds).
  # Runs as root + chmods the mounted passfile to 0600 (pgAdmin refuses a group/world-readable one),
  # which lets servers.json auto-import the saved password on first boot (no manual connect step).
  #
  # The passfile MUST live inside the login user's own storage directory, not at /pgpass. In SERVER_MODE
  # pgAdmin resolves servers.json PassFile through get_complete_file_path(), which joins the value onto
  # <STORAGE_DIR>/<user> and returns None when the result is not a file — so an absolute /pgpass silently
  # resolved to nothing and every connect failed with "fe_sendauth: no password supplied", leaving the
  # saved server showing as unreachable. Mounting it at the resolved path also pre-creates that directory,
  # which incidentally fixes a second bug: get_storage_directory() does a check-then-makedirs that raced
  # on first login (FileExistsError), aborting the master-password re-encryption of the saved password.
  pgadmin:
    # Pinned: the portal-verification e2e was validated against 9.13; `latest` drifts (tree/DOM changes).
    image: dpage/pgadmin4:9.13
    container_name: 3commerce-pgadmin
    profiles: ["portals"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NB: pgAdmin rejects reserved domains like .local — use a real-TLD dev address.
      PGADMIN_DEFAULT_EMAIL: admin@3commerce.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "5480:80"
    user: root
    entrypoint: ["/bin/sh", "-c", "chmod 600 /var/lib/pgadmin/storage/admin_3commerce.dev/pgpass 2>/dev/null || true; exec /entrypoint.sh"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Path must match PGADMIN_DEFAULT_EMAIL with @ and . preprocessed to _ and . (admin@3commerce.dev
      # -> admin_3commerce.dev); servers.json keeps PassFile "/pgpass", which resolves INTO this dir.
      - ./infra/pgadmin/pgpass:/var/lib/pgadmin/storage/admin_3commerce.dev/pgpass
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/misc/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # GlitchTip error inbox (http://localhost:8000, ADR-0067; owner decision Q5) — Sentry-API-compatible issue
  # triage: grouped issues, first-seen/regressions, assign/resolve. Every .NET host and the storefront report
  # errors here (SENTRY_DSN, handed out by scripts/lib/glitchtip.sh) with the release identity and the trace id,
  # so an issue leads to its trace in Grafana. Lean on purpose (6 GB dev VM):
  #   - ONE process: GlitchTip 7 serves HTTP and runs the task worker + scheduler in the same granian process
  #     (SERVER_ROLE / GLITCHTIP_EMBED_WORKER were removed in 7.0); one granian worker, ingest concurrency 2;
  #   - no Valkey: VALKEY_URL="" puts the task queue and cache in its Postgres database (the shared dev Postgres,
  #     database + role `glitchtip`, created on demand by the entrypoint — existing volumes included);
  #   - logs ingestion and uptime monitoring off (Loki and the alert rules do those jobs), short retention.
  # Dev identities (admin sign-in, the fixed DSNs, a read-only API token) live in glitchtip/glitchtip.env.
  glitchtip:
    image: glitchtip/glitchtip:7.0.0
    container_name: 3commerce-glitchtip
    profiles: ["portals"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/glitchtip/entrypoint.sh"]
    env_file:
      - deploy/observability/glitchtip/glitchtip.env
    environment:
      GLITCHTIP_DB_ADMIN_URL: postgres://postgres:postgres_dev@postgres:5432/postgres   # dev superuser: entrypoint only
      GLITCHTIP_DB_PASSWORD: glitchtip_dev
      DATABASE_URL: postgres://glitchtip:glitchtip_dev@postgres:5432/glitchtip
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "4"      # the shared Postgres also serves 14 services' pools
      VALKEY_URL: ""
      SECRET_KEY: glitchtip_dev_secret_key_not_for_production
      GLITCHTIP_DOMAIN: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1,glitchtip
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      GRANIAN_WORKERS: "1"
      VTASKS_INGEST_CONCURRENCY: "2"
      GLITCHTIP_ENABLE_LOGS: "false"
      GLITCHTIP_ENABLE_UPTIME: "false"
      GLITCHTIP_RETENTION_DAYS: "14"
      GLITCHTIP_PII_SCRUB_DEFAULT: '{"enabled": true, "scrub_emails": true}'
      LOG_LEVEL: WARNING
      GRANIAN_LOG_LEVEL: WARNING
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/observability/glitchtip/entrypoint.sh:/etc/glitchtip/entrypoint.sh:ro
      - ./deploy/observability/glitchtip/bootstrap.py:/etc/glitchtip/bootstrap.py:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "/code/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  pgdata:
  pgadmin_data:
  kafka_data:
  rabbitmq_data:
  valkey_data:
