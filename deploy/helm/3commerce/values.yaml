# Defaults = dev. Override with -f values-dev.yaml or -f values-prod.yaml.
environment: Development            # ASPNETCORE_ENVIRONMENT (Development = committed dev keys, admin seeded)
# Release identity (ADR-0064): deployment.environment.name on every span/metric/log of the .NET services, gateway
# and worker (dev | test | prod). Set per release stage — the `test` stage runs Production config but reports
# "test" (--set deploymentEnvironment=test). Rendered into OTEL_RESOURCE_ATTRIBUTES, which wins over the mapping.
deploymentEnvironment: dev

image:
  repoPrefix: 3commerce             # image = {repoPrefix}/{name}:{tag}; for kind, build+`kind load` these
  tag: local
  pullPolicy: IfNotPresent

resources:
  limits:
    memory: 512Mi

# DB-owning services. Image name == k8s Service name == container hostname in
# appsettings.Container.json, so no per-service config is needed here.
services:
  - identity
  - catalog
  - entity
  - ordering
  - payments
  - fulfillment
  - support
  - marketing
  - pricing
  - audit
  - workflow
  - entitlement
  - usage

# Prod only: name of an externally-created Secret holding InternalAuth__PrivateKey and
# InternalAuth__PublicKey (see deploy/helm/make-secret.sh). Empty in dev — images already
# carry the committed dev keys, accepted because ASPNETCORE_ENVIRONMENT=Development.
secret:
  name: ""

ingress:
  enabled: false
  className: ""
  host: 3commerce.local

postgres:
  deploy: true          # in-cluster Postgres (kind/dev). false + externalHost = use an external instance
  externalHost: ""
  image: postgres:18
  password: postgres_dev            # local/kind only

rabbitmq:
  image: rabbitmq:4-management

# Optional in-cluster pgAdmin DB portal (mirrors the local docker-compose one), pre-connected to the
# Postgres instance so all service DBs appear under one server. OFF by default — flip per environment
# with `pgadmin.enabled=true` (or `--set pgadmin.enabled=true`). dev/kind convenience only: it ships a
# saved passfile carrying the dev superuser password, so do NOT enable in prod without locking it down
# (network policy / auth) and swapping the credentials.
pgadmin:
  enabled: false
  image: dpage/pgadmin4:9.13
  email: admin@3commerce.dev        # portal login; pgAdmin rejects reserved domains like .local
  password: pgadmin_dev             # portal login (local/kind only)
  service:
    port: 80

# Error inbox (ADR-0067): GlitchTip, the self-hosted Sentry-API-compatible issue tracker, installed separately
# (deploy/helm/observability/values-glitchtip.yaml via install-lgtm.sh). `dsnSecret` names a Secret holding the DSNs of
# its two projects: key `backend` (every .NET process: services, gateway, worker, Admin, Supplier Portal) and key
# `storefront` (its /rum relay + SSR errors, sent server-side). Empty = off; a missing Secret or key = off too.
errorTracking:
  dsnSecret: ""

# Continuous profiling (ADR-0068): every .NET image carries the Pyroscope .NET profiler (a native CLR profiler, Linux
# x86_64/aarch64), inert until `enabled` sets CORECLR_ENABLE_PROFILING + LD_PRELOAD + PYROSCOPE_* on the .NET pods.
# It pushes to `serverAddress` (the `pyroscope` release of deploy/helm/observability/install-lgtm.sh); `tenant` is the
# X-Scope-OrgID of a multi-tenant Pyroscope. Overhead is a few percent CPU for the default types; walltime is off
# (it samples idle threads too). Span profiles (Tempo → Pyroscope) follow automatically when enabled.
profiling:
  enabled: false
  serverAddress: http://pyroscope.observability.svc:4040
  tenant: ""
  types:
    cpu: true
    walltime: false
    allocation: true
    lock: true
    exception: true

# Observability (ADR-0065). One in-chart OTel Collector is the telemetry door: every service/worker/gateway gets
# OTEL_EXPORTER_OTLP_ENDPOINT (the switch OtelExtensions keys OTLP export on), the storefront relays browser RUM to
# its Faro receiver, and it fans out — traces → Tempo, logs → Loki, metrics → Mimir remote-write. OFF by default
# (`--set observability.enabled=true`); values-prod.yaml turns it on with backend=external.
#   backend: inChart   single-binary Loki/Tempo/Mimir in this chart, emptyDir, no auth — dev/kind convenience.
#   backend: external  the self-hosted upstream LGTM install set (deploy/helm/observability: Loki/Tempo/Mimir on
#                      S3-compatible object storage + Grafana with the provisioned alert rules), installed separately
#                      by deploy/helm/observability/install-lgtm.sh; the collector exports to `external.*`.
observability:
  enabled: false
  backend: inChart
  # What the .NET processes export to (OTLP gRPC). Leave as the in-chart collector; `headersSecret` names a Secret
  # with an OTEL_EXPORTER_OTLP_HEADERS key, only needed if the collector is put behind client auth.
  otlp:
    endpoint: http://otel-collector:4317
    headersSecret: ""
  collector:
    # Latest contrib release (ADR-0065; same tag as docker-compose.yml). Validate a config change with this binary.
    image: otel/opentelemetry-collector-contrib:0.165.0
    replicas: 1           # tail sampling needs every span of a trace on ONE instance — scale out only behind a
                          # load-balancing exporter tier keyed on trace id (runbook)
    resources:
      limits:
        memory: 1Gi       # memory_limiter keeps the collector at 80 % of this
    # Browser RUM (Faro receiver, ClusterIP port 8027, internal only): the storefront's /rum route relays to
    # http://otel-collector:8027/ — never exposed through the ingress.
    faro:
      enabled: true
    # P2-5: k8s_attributes (pod/namespace/deployment/node names from the k8s API, needs the ClusterRole below) and
    # resource_detection (cluster-wide facts). Add a cloud detector (gcp, eks, aks, ec2, azure) per deployment.
    k8sAttributes:
      enabled: true
    resourceDetectors: [env]
    clusterName: ""       # k8s.cluster.name on every signal (env detector via OTEL_RESOURCE_ATTRIBUTES)
  # P1-7 tail sampling at the collector. Off = keep 100 % (dev/kind). Prod keeps every error, every trace slower
  # than the latency threshold (ADR-0029 p95 for reads: 800 ms), 100 % of checkout/payment/refund routes, and
  # `percentage` of the rest.
  sampling:
    enabled: false
    percentage: 15
    latencyThresholdMs: 800
    alwaysKeepRoutes: "(?i).*(checkout|payment|refund).*"
  # backend=external: where the collector exports. Defaults match install-lgtm.sh (namespace `observability`).
  external:
    tenant: 3commerce     # X-Scope-OrgID on every push (Loki/Tempo/Mimir multi-tenancy is on in the install set)
    loki: http://loki-gateway.observability.svc/otlp
    tempo: tempo.observability.svc:4317
    mimir: http://mimir-gateway.observability.svc/api/v1/push
    tlsInsecure: true     # cluster-internal plain gRPC/HTTP; set false + mount CAs for a cross-cluster backend
  loki:
    image: grafana/loki:3.3.2
  tempo:
    image: grafana/tempo:2.6.1
  mimir:
    image: grafana/mimir:2.14.1
  # Retention (ADR-0065 Q2): traces 14 d, logs 30 d, metrics 13 months, security logs (authentication, permission
  # denied — the collector labels them log_category=security) 12 months. Applied to the in-chart stack here; the
  # external install set carries the same numbers in deploy/helm/observability/values-*.yaml. Dev keeps metrics
  # 30 d. (The in-chart stack is emptyDir-backed, so a pod restart loses everything sooner.)
  retention:
    logs: 720h          # 30 days
    securityLogs: 8760h # 12 months
    traces: 336h        # 14 days
    metrics: 30d        # dev; prod = 395d (~13 months)

# Notifications' only email sender logs instead of delivering. Outside Development the worker refuses to
# boot unless this acknowledges a sandbox that sends no email (EmailSenderGuard, audit P0-2). Even when
# true, a non-Development worker logs only email metadata (subject, reference, recipient hash), never
# bodies or links. Production stays false until a real provider is wired.
notifications:
  allowLoggingEmailSender: false

kafka:
  enabled: false         # enables EventStreaming config for apps; core workflows do not depend on Kafka
  deploy: false          # dev/kind only. Production should prefer managed Kafka and externalBootstrapServers.
  image: bitnami/kafka:3.9
  externalBootstrapServers: ""
  bootstrapServers: kafka:9092
  ui:
    enabled: false       # dev/kind only; exposes kafka-ui service in-cluster
    image: provectuslabs/kafka-ui:v0.7.2
  securityProtocol: ""  # e.g. SASL_SSL for managed Kafka
  saslMechanism: ""     # e.g. PLAIN or SCRAM-SHA-512
  saslSecret:
    name: ""            # optional Secret with SaslUsername/SaslPassword keys
