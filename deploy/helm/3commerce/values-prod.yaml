# Prod overlay: BL-11 gate enforced. Create the Secret first:
#   deploy/helm/make-secret.sh | kubectl apply -f -
# then: helm install 3commerce deploy/helm/3commerce -f values-prod.yaml
environment: Production
deploymentEnvironment: prod   # a release-candidate (test) install: --set deploymentEnvironment=test
secret:
  name: 3commerce-secrets
kafka:
  enabled: false
  deploy: false
  externalBootstrapServers: ""
# Notifications fails closed: no real email provider yet, so the worker refuses to boot here unless an
# operator explicitly acknowledges a sandbox (--set notifications.allowLoggingEmailSender=true).
notifications:
  allowLoggingEmailSender: false
# Telemetry ships to the self-hosted LGTM install set (ADR-0065 Q1) — install it first:
#   deploy/helm/observability/install-lgtm.sh   (Loki/Tempo/Mimir on object storage + Grafana with alerting)
# The collector tail-samples (keep errors, slow traces and checkout/payment routes, 15 % of the rest).
# Error inbox (ADR-0067): create the Secret from the DSNs of the production GlitchTip projects first —
#   kubectl create secret generic glitchtip-dsn --from-literal=backend=<dsn> --from-literal=storefront=<dsn>
# (runbook "Error inbox (GlitchTip)"); without it the pods start with error tracking off.
errorTracking:
  dsnSecret: glitchtip-dsn

# Continuous profiling (ADR-0068): push to the `pyroscope` release (install-lgtm.sh), tenant 3commerce like LGTM.
profiling:
  enabled: true
  tenant: 3commerce

observability:
  enabled: true
  backend: external
  sampling:
    enabled: true
    percentage: 15
  retention:
    logs: 720h          # 30 days
    securityLogs: 8760h # 12 months
    traces: 336h        # 14 days
    metrics: 395d       # ~13 months
