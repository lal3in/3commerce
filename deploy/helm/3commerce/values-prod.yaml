# Prod overlay: BL-11 gate enforced. Create the Secret first:
#   deploy/helm/make-secret.sh | kubectl apply -f -
# then: helm install 3commerce deploy/helm/3commerce -f values-prod.yaml
environment: Production
deploymentEnvironment: prod   # a release-candidate (test) install: --set deploymentEnvironment=test
secret:
  name: 3commerce-secrets
kafka:
  enabled: false
  deploy: false
  externalBootstrapServers: ""
# Notifications fails closed: no real email provider yet, so the worker refuses to boot here unless an
# operator explicitly acknowledges a sandbox (--set notifications.allowLoggingEmailSender=true).
notifications:
  allowLoggingEmailSender: false
# Retention for the optional in-chart LGTM stack (observability.enabled=true): metrics kept 13 months.
observability:
  retention:
    logs: 720h          # 30 days
    traces: 336h        # 14 days
    metrics: 395d       # ~13 months
