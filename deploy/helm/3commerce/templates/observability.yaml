{{- if .Values.observability.enabled }}
{{- $o := .Values.observability }}
{{- $ext := eq $o.backend "external" }}
{{- $k8s := $o.collector.k8sAttributes.enabled }}
# The OTel Collector (ADR-0065): the cluster's one telemetry door — .NET OTLP (4317/4318) and the storefront's
# relayed browser RUM (Faro, 8027) in; traces → Tempo, logs → Loki (native /otlp), metrics → Mimir remote-write out.
# backend=inChart exports to observability-inchart.yaml's single binaries; backend=external to the self-hosted LGTM
# install set (deploy/helm/observability) with the X-Scope-OrgID tenant header. The shared processors are the dev
# collector's (deploy/observability/otel-collector-config.yaml) verbatim — keep them identical; this copy adds
# k8s_attributes + resource_detection (P2-5) and tail sampling (P1-7). Validate edits with the pinned binary:
#   helm template … -s templates/observability.yaml | yq '.data."config.yaml"' | otelcol-contrib validate --config=/dev/stdin
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if $o.collector.faro.enabled }}
      # Browser RUM relayed by the storefront's same-origin /rum route (alpha stability at 0.165.0). ClusterIP only.
      faro:
        endpoint: 0.0.0.0:8027
      {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
      {{- if $k8s }}
      # P2-5: pod/deployment/namespace/node of the sender, from the k8s API (namespace-scoped Role below). Associated by
      # the connection's pod IP — so ONLY on the otlp input pipelines: relayed browser data would otherwise be
      # attributed to the storefront pod.
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          namespace: {{ .Release.Namespace }}
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      {{- end }}
      # P2-5: cluster-wide facts (env: OTEL_RESOURCE_ATTRIBUTES of the collector → k8s.cluster.name; add a cloud
      # detector per deployment). override=false: a service's own attributes always win.
      resource_detection:
        detectors: {{ toJson $o.collector.resourceDetectors }}
        timeout: 2s
        override: false
      transform/faro_anonymise:
        error_mode: ignore
        log_statements:
          - 'delete_matching_keys(resource.attributes, "(?i)^(user[._].*|enduser[.].*|session[._].*|client[._].*|.*[._]ip|network[.]peer[.].*|net[.]peer[.].*|http[.]client_ip|geo[._].*|browser[._]user_?agent|user_agent[.].*)$")'
          - 'delete_matching_keys(log.attributes, "(?i)^(user[._].*|enduser[.].*|session[._].*|client[._].*|.*[._]ip|network[.]peer[.].*|net[.]peer[.].*|http[.]client_ip|geo[._].*|browser[._]user_?agent|user_agent[.].*)$")'
          - 'replace_pattern(log.body, "(^| )(user_[A-Za-z_]+|session_[A-Za-z_]+|geo_[A-Za-z_]+|browser_userAgent|app_installation_id|[A-Za-z_]*_ip)=(\"[^\"]*\"|[^ ]*)", "")'
          - 'replace_pattern(log.body, "(page_url|context_url|url)=(\"?)([^ ?\"]*)[?][^ \"]*", "$$1=$$2$$3")'
        trace_statements:
          - 'delete_matching_keys(resource.attributes, "(?i)^(user[._].*|enduser[.].*|session[._].*|client[._].*|.*[._]ip|network[.]peer[.].*|net[.]peer[.].*|http[.]client_ip|geo[._].*|browser[._]user_?agent|user_agent[.].*)$")'
          - 'delete_matching_keys(span.attributes, "(?i)^(user[._].*|enduser[.].*|session[._].*|client[._].*|.*[._]ip|network[.]peer[.].*|net[.]peer[.].*|http[.]client_ip|geo[._].*|browser[._]user_?agent|user_agent[.].*)$")'
          - 'replace_pattern(span.attributes["url.full"], "[?].*", "")'
          - 'replace_pattern(span.attributes["http.url"], "[?].*", "")'
      # Defence in depth against secrets/PII (audit P0-2, PR #303) — identical to the dev copy.
      transform/redact:
        error_mode: ignore
        log_statements:
          - 'delete_matching_keys(log.attributes, "(?i)^(authorization|cookie|set-cookie|.*[.]header[.](authorization|cookie|set-cookie))")'
          - 'replace_pattern(log.body, "(?i)token=[A-Za-z0-9._~%+/=-]+", "token=[REDACTED]")'
          - 'replace_pattern(log.body, "(?i)password=[^&[:space:]]+", "password=[REDACTED]")'
          - 'replace_pattern(log.body, "(?i)bearer [A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")'
          - 'replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}", "[REDACTED_EMAIL]")'
          - 'replace_all_patterns(log.attributes, "value", "(?i)token=[A-Za-z0-9._~%+/=-]+", "token=[REDACTED]")'
          - 'replace_all_patterns(log.attributes, "value", "(?i)password=[^&[:space:]]+", "password=[REDACTED]")'
          - 'replace_all_patterns(log.attributes, "value", "(?i)bearer [A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")'
          - 'replace_all_patterns(log.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}", "[REDACTED_EMAIL]")'
        trace_statements:
          - 'delete_matching_keys(span.attributes, "(?i)^(authorization|cookie|set-cookie|.*[.]header[.](authorization|cookie|set-cookie))")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)token=[A-Za-z0-9._~%+/=-]+", "token=[REDACTED]")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)password=[^&[:space:]]+", "password=[REDACTED]")'
          - 'replace_all_patterns(span.attributes, "value", "(?i)bearer [A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")'
          - 'replace_all_patterns(span.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}", "[REDACTED_EMAIL]")'
      # Each log attribute capped at 8 KB after redaction: Loki's 64 KB structured-metadata limit otherwise fails a
      # whole push with a 400 the exporter drops (identical to dev; see deploy/observability/otel-collector-config.yaml).
      transform/truncate_attributes:
        error_mode: ignore
        log_statements:
          - 'truncate_all(log.attributes, 8192)'
      # Background EF/MassTransit polling logs with no trace (identical to dev; audit P0-5 "noise filter").
      filter/loki_noise:
        error_mode: ignore
        log_conditions:
          - 'log.trace_id == TraceID(0x00000000000000000000000000000000) and (instrumentation_scope.name == "Microsoft.EntityFrameworkCore.Database.Command" or IsMatch(instrumentation_scope.name, "^MassTransit"))'
      # Security logs → Loki stream label log_category=security → 12-month retention_stream (ADR-0065 Q2).
      transform/security_category:
        error_mode: ignore
        log_statements:
          - 'set(log.attributes["log.category"], "security") where log.attributes["log.category"] == nil and IsMatch(instrumentation_scope.name, "^(ThreeCommerce[.]Identity[.].*(Auth|Login|Session|Mfa|Password|Lockout|StepUp|Token).*|ThreeCommerce[.]BuildingBlocks[.]Infrastructure[.]Authz[.].*|ThreeCommerce[.]Gateway[.](Auth|RateLimiting)[.].*|ThreeCommerce[.]Admin[.]Services[.]IpAllowlistMiddleware|ThreeCommerce[.]SupplierPortal[.].*Auth.*|Microsoft[.]AspNetCore[.](Authentication|Authorization)([.].*)?)$")'
      groupbyattrs/log_category:
        keys: [log.category]
      {{- if $o.sampling.enabled }}
      # P1-7 tail sampling: a trace is kept when ANY policy keeps it. One collector replica sees every span of a
      # trace (tail sampling requires it); Tempo's service-graph/span-metrics are therefore post-sampling — the
      # SLO alerts use the SDK's unsampled http_server_request_duration metrics instead.
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          - name: errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: slower-than-p95-slo
            type: latency
            latency: { threshold_ms: {{ $o.sampling.latencyThresholdMs }} }
          - name: checkout-and-payment-routes
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'IsMatch(span.attributes["http.route"], {{ $o.sampling.alwaysKeepRoutes | quote }})'
                - 'IsMatch(span.attributes["url.path"], {{ $o.sampling.alwaysKeepRoutes | quote }})'
                - 'IsMatch(span.name, {{ $o.sampling.alwaysKeepRoutes | quote }})'
          - name: baseline
            type: probabilistic
            probabilistic: { sampling_percentage: {{ $o.sampling.percentage }} }
      {{- end }}
    connectors:
      forward/traces: {}
      forward/logs: {}
    exporters:
      {{- if $ext }}
      prometheus_remote_write:
        endpoint: {{ $o.external.mimir }}
        headers:
          X-Scope-OrgID: {{ $o.external.tenant | quote }}
        resource_constant_labels:
          included: ["*"]
      otlp_grpc/tempo:
        endpoint: {{ $o.external.tempo }}
        headers:
          X-Scope-OrgID: {{ $o.external.tenant | quote }}
        tls:
          insecure: {{ $o.external.tlsInsecure }}
      otlp_http/loki:
        endpoint: {{ $o.external.loki }}
        headers:
          X-Scope-OrgID: {{ $o.external.tenant | quote }}
        {{- if $o.external.tlsInsecure }}
        tls:
          insecure: true
        {{- end }}
      {{- else }}
      prometheus_remote_write:
        endpoint: http://mimir:9009/api/v1/push
        # Keep every resource attribute (service.name, …) as a label so dashboards can break down per service.
        resource_constant_labels:
          included: ["*"]
      otlp_grpc/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true  # plain gRPC inside the cluster
      otlp_http/loki:
        endpoint: http://loki:3100/otlp
      {{- end }}
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: normal
          # Self-telemetry through the collector's own OTLP receiver → Mimir (the collector-down heartbeat alert).
          readers:
            - periodic:
                interval: 30000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://127.0.0.1:4318/v1/metrics
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter{{ if $k8s }}, k8s_attributes{{ end }}, resource_detection, batch]
          exporters: [prometheus_remote_write]
        traces/otlp:
          receivers: [otlp]
          processors: [memory_limiter{{ if $k8s }}, k8s_attributes{{ end }}]
          exporters: [forward/traces]
        {{- if $o.collector.faro.enabled }}
        traces/faro:
          receivers: [faro]
          processors: [memory_limiter, transform/faro_anonymise]
          exporters: [forward/traces]
        {{- end }}
        traces:
          receivers: [forward/traces]
          processors: [resource_detection, transform/redact{{ if $o.sampling.enabled }}, tail_sampling{{ end }}, batch]
          exporters: [otlp_grpc/tempo]
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter{{ if $k8s }}, k8s_attributes{{ end }}]
          exporters: [forward/logs]
        {{- if $o.collector.faro.enabled }}
        logs/faro:
          receivers: [faro]
          processors: [memory_limiter, transform/faro_anonymise]
          exporters: [forward/logs]
        {{- end }}
        logs:
          receivers: [forward/logs]
          processors: [resource_detection, filter/loki_noise, transform/redact, transform/truncate_attributes, transform/security_category, groupbyattrs/log_category, batch]
          exporters: [otlp_http/loki]
{{- if $k8s }}
---
# k8s_attributes reads pods (+ replicasets for k8s.deployment.name) in THIS namespace only (filter.namespace above):
# a namespaced Role, not a ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-collector
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: otel-collector
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
    {{- include "3commerce.labels" . | nindent 4 }}
spec:
  replicas: {{ $o.collector.replicas }}
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # Roll the pod when the observability values change (the collector does not hot-reload its config).
        checksum/config: {{ toJson $o | sha256sum | trunc 16 | quote }}
    spec:
      {{- if $k8s }}
      serviceAccountName: otel-collector
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ $o.collector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          {{- with $o.collector.clusterName }}
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "k8s.cluster.name=%s" . | quote }}
          {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- if $o.collector.faro.enabled }}
            - name: faro
              containerPort: 8027
            {{- end }}
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $o.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# ClusterIP only — never routed by the ingress. Port 8027 is the Faro receiver the storefront relays browser RUM to.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    {{- if $o.collector.faro.enabled }}
    - name: faro
      port: 8027
      targetPort: 8027
    {{- end }}
    - name: health
      port: 13133
      targetPort: 13133
{{- end }}
