{{- if and .Values.observability.enabled (eq .Values.observability.backend "inChart") }}
# In-chart LGTM backends (observability.backend=inChart, the default): single-binary Loki/Tempo/Mimir with emptyDir
# storage and no auth/multitenancy — the in-cluster mirror of the docker-compose `observability` profile, for
# dev/kind. Telemetry dies with the pod. Production uses backend=external: the self-hosted upstream LGTM install set
# on object storage (deploy/helm/observability, ADR-0065). No Prometheus here — Mimir IS the PromQL endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # v13 schema + structured metadata are both required for the native /otlp endpoint.
      allow_structured_metadata: true
      # Ingest limits = deploy/observability/loki.yaml (the defaults 429'd a seeded dev stack); oversized lines are
      # truncated instead of failing the whole push with a 400 the collector drops.
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      per_stream_rate_limit: 8MB
      per_stream_rate_limit_burst: 32MB
      max_line_size_truncate: true
      # Logs are deleted after this (observability.retention.logs); enforced by the compactor below.
      retention_period: {{ .Values.observability.retention.logs }}
      # Security logs (log_category=security, set by the collector) are kept observability.retention.securityLogs
      # (12 months, ADR-0065 Q2) — same as deploy/observability/loki.yaml.
      otlp_config:
        resource_attributes:
          attributes_config:
            - action: index_label
              attributes: [log.category]
      retention_stream:
        - selector: '{log_category="security"}'
          priority: 1
          period: {{ .Values.observability.retention.securityLogs }}
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            # Tempo >= 2.6 binds receivers to localhost by default — unreachable from the
            # collector pod, so bind 0.0.0.0 explicitly.
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal
    compactor:
      compaction:
        block_retention: {{ .Values.observability.retention.traces }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  labels:
    {{- include "3commerce.labels" . | nindent 4 }}
data:
  config.yaml: |
    multitenancy_enabled: false
    server:
      # Mimir defaults to 8080, the app port convention here — use the Mimir demo port instead.
      http_listen_port: 9009
      log_level: warn
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/storage
    blocks_storage:
      storage_prefix: blocks
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
        replication_factor: 1
    store_gateway:
      sharding_ring:
        instance_addr: 127.0.0.1
        replication_factor: 1
    limits:
      # Metric blocks older than this are deleted by the compactor (observability.retention.metrics).
      compactor_blocks_retention_period: {{ .Values.observability.retention.metrics }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
    {{- include "3commerce.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.observability.loki.image }}
          args: ["-config.file=/etc/loki/config.yaml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app: tempo
    {{- include "3commerce.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image }}
          args: ["-config.file=/etc/tempo.yaml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /var/tempo
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  labels:
    app: mimir
    {{- include "3commerce.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: {{ .Values.observability.mimir.image }}
          args: ["-config.file=/etc/mimir.yaml"]
          ports:
            - containerPort: 9009
          volumeMounts:
            - name: config
              mountPath: /etc/mimir.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  labels:
    app: mimir
spec:
  selector:
    app: mimir
  ports:
    - port: 9009
      targetPort: 9009
{{- end }}
