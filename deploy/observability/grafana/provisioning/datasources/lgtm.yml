# Grafana datasource provisioning: the LGTM backends behind the collector fan-out. Fixed uids so
# the cross-links below (and dashboards) survive re-provisioning. All provisioned dashboards query
# these uids — Prometheus (prometheus.yml) stays the default for ad-hoc exploration only.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # OTLP ingest lands trace_id as structured metadata, not in the log line — a label
      # matcher (not a line regex) is what makes the log→trace link appear.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # Logs around a span rarely share its exact window — pad both sides.
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags: [{ key: "service.name", value: "service_name" }]
        filterByTraceID: true
      # Trace → metrics: from a span, jump to the RED span-metrics the generator writes to Mimir,
      # scoped to the same service. (traces_spanmetrics_* are produced by Tempo's span-metrics processor.)
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags: [{ key: "service.name", value: "service" }]
        queries:
          - name: "Request rate"
            query: "sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))"
          - name: "p95 latency"
            query: "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))"
      # Service Graph tab + node graph — driven by the service-graph metrics in Mimir.
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true

  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    editable: false
    jsonData:
      # Metric → trace: span-metrics carry a trace_id exemplar, so panels link back to Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
