# OTel Collector (mt6_13): the single OTLP door for every service; fans each signal out to the
# LGTM stack — traces → Tempo, logs → Loki, metrics → Prometheus scrape + Mimir remote-write.
# Both metric exporters stay: Mimir is what the dashboards query (durable, host-reachable), while
# the Prometheus scrape target remains a zero-dependency local view for debugging the collector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Valkey/Redis server metrics (memory, evictions, keyspace, replication) via redis_exporter (ADR-0044).
  # The exporter runs in the infra compose under the `portals` profile on :9121; the collector must share
  # that network to reach it (best-effort — scrape failures are logged, never fatal, so the OTLP door for
  # the app-level 3commerce.redis metrics is unaffected when the exporter is absent in a lean CI run).
  prometheus/redis:
    config:
      scrape_configs:
        - job_name: redis-exporter
          scrape_interval: 15s
          static_configs:
            - targets: ['redis-exporter:9121']

processors:
  batch: {}
  # Defence in depth against secrets/PII in telemetry (observability audit P0-2). The services must not
  # log them in the first place (LoggingEmailSender logs bodies/links in Development only); this catches
  # what slips through before it is stored: one-time tokens in links/query strings, bearer credentials,
  # email addresses, and Authorization/Cookie headers (as attributes). Built-in `transform` processor of
  # the contrib image in use (0.110.0) — no new image. Regexes avoid backslashes and dollar signs on purpose (no
  # escaping or env-expansion surprises); keep this block identical to the Helm copy
  # (deploy/helm/3commerce/templates/observability.yaml).
  transform/redact:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'delete_matching_keys(attributes, "(?i)^(authorization|cookie|set-cookie|.*[.]header[.](authorization|cookie|set-cookie))")'
          - 'replace_pattern(body, "(?i)token=[A-Za-z0-9._~%+/=-]+", "token=[REDACTED]")'
          - 'replace_pattern(body, "(?i)password=[^&[:space:]]+", "password=[REDACTED]")'
          - 'replace_pattern(body, "(?i)bearer [A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")'
          - 'replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}", "[REDACTED_EMAIL]")'
          - 'replace_all_patterns(attributes, "value", "(?i)token=[A-Za-z0-9._~%+/=-]+", "token=[REDACTED]")'
          - 'replace_all_patterns(attributes, "value", "(?i)password=[^&[:space:]]+", "password=[REDACTED]")'
          - 'replace_all_patterns(attributes, "value", "(?i)bearer [A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")'
          - 'replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}", "[REDACTED_EMAIL]")'
    trace_statements:
      - context: span
        statements:
          - 'delete_matching_keys(attributes, "(?i)^(authorization|cookie|set-cookie|.*[.]header[.](authorization|cookie|set-cookie))")'
          - 'replace_all_patterns(attributes, "value", "(?i)token=[A-Za-z0-9._~%+/=-]+", "token=[REDACTED]")'
          - 'replace_all_patterns(attributes, "value", "(?i)password=[^&[:space:]]+", "password=[REDACTED]")'
          - 'replace_all_patterns(attributes, "value", "(?i)bearer [A-Za-z0-9._~+/=-]+", "Bearer [REDACTED]")'
          - 'replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}", "[REDACTED_EMAIL]")'
  # Declutter the Loki log view: drop the high-volume BACKGROUND logs that carry no trace context —
  # EF SQL from outbox/inbox polling and MassTransit bus polling run outside any request span, so they
  # have an empty trace_id and can never link to a trace. Guarded on trace_id == 0 so in-request
  # EF/MassTransit logs (which DO carry a trace_id) are kept and stay trace-linkable in Loki.
  filter/loki_noise:
    error_mode: ignore
    logs:
      log_record:
        - 'trace_id == TraceID(0x00000000000000000000000000000000) and (instrumentation_scope.name == "Microsoft.EntityFrameworkCore.Database.Command" or IsMatch(instrumentation_scope.name, "^MassTransit"))'

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep the service.name resource attribute as a label so dashboards can break down per service.
    resource_to_telemetry_conversion:
      enabled: true
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true  # plain gRPC inside the compose network
  otlphttp/loki:
    # Loki 3 native OTLP ingest — no Loki exporter/promtail hop needed.
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus/redis]
      processors: [batch]
      exporters: [prometheus, prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [filter/loki_noise, transform/redact, batch]
      exporters: [otlphttp/loki]
