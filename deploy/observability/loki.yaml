# Loki (single-binary, filesystem storage) — local dev only. No auth/multitenancy so the
# collector can push straight to /otlp and Grafana can query without headers; anything
# production-shaped needs object storage + tenants instead of this file.
auth_enabled: false

server:
  http_listen_port: 3100
  # The collector's default batch (8192 records) of verbose service logs is ~5–6 MB; the single-binary
  # distributor forwards it to the ingester over gRPC, whose 4 MB default rejected it ("received message
  # larger than max") and the push came back 503 — retried until dropped, so those logs never landed.
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP-native ingest stores resource/log attributes (incl. trace_id) as structured
  # metadata — v13 schema + this flag are both required for the /otlp endpoint to accept data.
  allow_structured_metadata: true
  # Explicit retention (observability audit P0-2 / Q2): log chunks older than 30 days are deleted. Without
  # this Loki keeps everything forever. Enforced by the compactor below (retention needs both).
  retention_period: 720h
  # Security logs (authentication, permission denied) are kept 12 months (ADR-0065 Q2). The collector marks them
  # with the resource attribute log.category=security (transform/security_category + groupbyattrs), which this
  # otlp_config indexes as the stream label `log_category` (the default resource labels — service_name, … — stay).
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [log.category]
  retention_stream:
    - selector: '{log_category="security"}'
      priority: 1
      period: 8760h     # 365 days
  # Ingest limits sized for a seeded dev-up (2026-11-19). At Loki's defaults (4 MB/s, burst 6 MB, 3 MB/s per
  # stream) the seed's import burst — the collector pushes ~3 MB batches several times a second — was refused
  # with 429 "Ingestion rate limit exceeded" (411k lines rate-limited across the retries; the collector backs off
  # and retries, so logs landed minutes late). 16 MB/s with a 32 MB burst admits that burst; the per-stream limit
  # (one stream = one service instance) follows so a single chatty service (catalog during the import) is not the
  # bottleneck instead. Bounded on purpose: 64 MB/s once let a `--data full` seed land everything at once and Loki
  # was OOM-killed (~3 GB RSS) in a 6 GB Colima VM — measured at these values Loki stays well under 1 GB.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 32MB
  # A single log line over max_line_size (256 KB default) used to fail the WHOLE push with a 400, and the collector
  # drops a 400 as permanent: one 576 KB EF SQL line from the catalog import cost 25k unrelated log records. Truncate
  # the oversized line instead; the rest of the batch lands.
  max_line_size_truncate: true

# The compactor applies retention_period (above) and processes delete requests. Loki 3 requires a
# delete_request_store once retention is enabled.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
